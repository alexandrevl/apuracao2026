[project]
name = "apuracao"
version = "0.1.0"
description = "Acompanhamento pessoal da apuração do 2º turno de 2026 (TSE) no terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "alexandrevl" }]
keywords = ["eleições", "eleicoes", "tse", "apuração", "brasil", "terminal", "tui", "dados-abertos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "textual>=0.80",
    "textual-plotext>=1.0.1",
    "typer>=0.12",
]

[project.scripts]
apuracao = "apuracao.cli:app"

[project.urls]
Repository = "https://github.com/alexandrevl/apuracao2026"
Issues = "https://github.com/alexandrevl/apuracao2026/issues"
Changelog = "https://github.com/alexandrevl/apuracao2026/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apuracao"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Só regras que apontam erro real (pyflakes, sintaxe, bugbear); estilo fica de fora.
select = ["E4", "E7", "E9", "F", "B"]
