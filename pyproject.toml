[project]
name = "apuracao"
version = "0.1.0"
description = "Acompanhamento pessoal da apuração do 2º turno de 2026 (TSE) no terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "textual>=0.80",
    "textual-plotext>=1.0.1",
    "typer>=0.12",
]

[project.scripts]
apuracao = "apuracao.cli:app"

[project.urls]
Repository = "https://github.com/alexandrevl/apuracao2026"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apuracao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
